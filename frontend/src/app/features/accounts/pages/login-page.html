<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Logowanie</h1>

    <mat-form-field appearance="outline">
      <mat-label>E-mail</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.hasError('email')) {
        <mat-error>Podaj poprawny adres e-mail.</mat-error>
      } @else {
        <mat-error>Podaj adres e-mail.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Hasło</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
      <mat-error>Podaj hasło.</mat-error>
    </mat-form-field>

    @if (auth.error(); as message) {
      <p class="error">{{ message }}</p>
    }

    <button mat-flat-button type="submit" [disabled]="auth.pending()">Zaloguj się</button>
    @if (auth.pending()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <p class="muted">Nie masz konta? <a routerLink="/rejestracja">Załóż konto</a></p>
  </form>
</div>

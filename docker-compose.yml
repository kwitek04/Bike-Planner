services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: bikeplanner
      POSTGRES_USER: ${DB_USER:-bikeplanner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bikeplanner}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d bikeplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:

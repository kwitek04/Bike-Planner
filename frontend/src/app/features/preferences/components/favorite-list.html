<ul class="favorites">
  @for (favorite of favorites(); track favorite.id) {
    <li>
      <div class="info">
        <span class="name">{{ favorite.name }}</span>
        <span class="details">
          {{ favorite.distanceMeters / 1000 | number: '1.1-1' }} km · rower
          {{ profileLabel(favorite.route.baseProfile) }} · {{ favorite.route.points.length }} pkt ·
          zapisano {{ favorite.createdAt | date: 'd MMM y, HH:mm' }}
        </span>
      </div>
      <div class="actions">
        <button mat-stroked-button type="button" (click)="opened.emit(favorite)">
          Pokaż
        </button>
        <button mat-button type="button" class="remove" (click)="removed.emit(favorite)">
          Usuń
        </button>
      </div>
    </li>
  }
</ul>

spring:
  application:
    name: bikeplanner
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bikeplanner
    username: ${DB_USER:bikeplanner}
    password: ${DB_PASSWORD:bikeplanner}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

accounts:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploy}
    ttl: 8h

routing:
  graphhopper:
    osm-file: data/dolnoslaskie-latest.osm.pbf
    graph-location: data/graph-cache
    elevation:
      enabled: true
      cache-dir: data/srtm

management:
  endpoints:
    web:
      exposure:
        include: health,info
